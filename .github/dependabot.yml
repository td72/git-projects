version: 2
updates:
  # ここでの interval は定期的なバージョン更新の頻度。脆弱性修正は
  # Dependabot security updates が検知次第 PR を出すので、この設定とは無関係。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ⬆️
    groups:
      # 更新はまとめて 1 PR にする。
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ⬆️
    groups:
      cargo:
        patterns: ["*"]
